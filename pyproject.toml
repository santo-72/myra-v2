[project]
name = "myra-ai"
version = "0.1.0"
description = "M.Y.R.A-Class Autonomous AI Assistant"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.7.0",
    "google-genai>=0.2.0",
    "faster-whisper>=1.0.3",
    "pyannote.audio>=3.1.1",
    "torchaudio<2.9.0",
    "sounddevice>=0.4.6",
    "webrtcvad>=2.0.10",
    "setuptools",
    "chromadb>=0.4.24",
    "websockets>=12.0",
    "structlog>=24.1.0",
    "numpy<2.0.0",
    "scipy>=1.12.0",
    "PyQt6>=6.6.0",
    "GitPython>=3.1.40",
    "PyGithub>=2.1.1",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "mss>=9.0.0",
    "Pillow>=10.2.0",
    "APScheduler>=3.10.4",
    "playwright>=1.41.0",
    "PyAutoGUI>=0.9.54",
    "psutil>=5.9.8",
    "cryptography>=42.0.0",
    "opencv-python>=4.9.0",
    "twilio>=8.0.0",
    "ollama>=0.1.0",
    "tensorflow-cpu>=2.15.0",
    "tensorflow-hub>=0.16.1",
    "docker>=7.0.0",
    "mediapipe>=0.10.9",
    "librosa>=0.10.1",
    "brainflow>=5.7.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "solana>=0.33.0",
    "pqcrypto>=0.4.0",
    "bandit>=1.7.7",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "aiolimiter>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
